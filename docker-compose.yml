services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
      POSTGRES_DB: finops
    ports:
      - "5432:5432"
    volumes:
      - finops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      FINOPS_ENV: docker
      FINOPS_DATABASE_URL: postgresql://finops:finops@db:5432/finops
      FINOPS_AWS_REGIONS: us-east-1
      FINOPS_TERRAFORM_PATH: /app/demo/terraform/main.tf
      FINOPS_TERRAFORM_REPO_PATH: demo/terraform/main.tf
      FINOPS_SLACK_CHANNEL: "#finops-approvals"
    ports:
      - "8000:8000"

volumes:
  finops-postgres:

